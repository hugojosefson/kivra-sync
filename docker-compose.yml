services:
  kivra-sync:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Mount a directory to store the downloaded documents
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: "none"
    command: >
      --interaction-provider=web
      --storage-provider=filesystem
      --base-dir=/data
